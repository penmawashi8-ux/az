name: kensho-collect

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）
    - cron: "47 */3 * * *" # 予備（定期実行が間引かれたとき用）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kensho/**", ".github/workflows/kensho.yml"]

permissions:
  contents: write

concurrency:
  group: kensho-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data branch
        run: |
          mkdir data
          if git ls-remote --exit-code --heads origin kensho-data >/dev/null; then
            git fetch --depth=1 origin kensho-data
            git show FETCH_HEAD:data.json > data/data.json
            git show FETCH_HEAD:state.json > data/state.json
            git show FETCH_HEAD:applied.json > data/applied.json 2>/dev/null || rm -f data/applied.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        env:
          KENSHO_DATA: data/data.json
          KENSHO_STATE: data/state.json
          KENSHO_NEW: new_items.json
        run: python kensho/collect.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto apply (Web open sweepstakes)
        continue-on-error: true
        env:
          KENSHO_PROFILE: ${{ secrets.KENSHO_PROFILE }}
          # 任意：クイズをClaudeで解く（未設定ならページ本文から推測）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 0 = 入力までの試運転 / 1 = 実際に送信
          KENSHO_SUBMIT: "1"
          KENSHO_DATA: data/data.json
          KENSHO_APPLIED: data/applied.json
        run: |
          if [ -z "$KENSHO_PROFILE" ]; then echo "KENSHO_PROFILE secret not set; skip"; exit 0; fi
          cd kensho && npm init -y >/dev/null && npm i --no-save --no-audit --no-fund playwright@1.49.1 @anthropic-ai/sdk@latest >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd .. && node kensho/autoapply.mjs

      - name: Publish data branch
        run: |
          cd data
          git init -q -b kensho-data
          git config user.name "kensho-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json $( [ -f applied.json ] && echo applied.json )
          git commit -q -m "data: $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kensho-data

      - name: Notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_MIN_SCORE: ${{ vars.NTFY_MIN_SCORE || '30' }}
          KENSHO_PAGE_URL: ${{ vars.KENSHO_PAGE_URL || 'https://penmawashi8-ux.github.io/az/kensho/' }}
        run: python kensho/notify.py new_items.json
